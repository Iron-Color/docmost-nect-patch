name: Release

on:
  push:
    tags:
      - "v*-user-spaces.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify tag and source commit
        id: source
        shell: bash
        run: |
          commit_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-list -n 1 "$GITHUB_REF")"
          test "$commit_sha" = "$tag_sha"
          git diff --quiet
          git diff --cached --quiet
          echo "sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Derive lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=sha-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_CODE_URL=https://github.com/${{ github.repository }}/tree/${{ steps.source.outputs.sha }}
            SOURCE_CODE_REVISION=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Container image: `${{ steps.image.outputs.name }}:${{ github.ref_name }}`
            Digest: `${{ steps.build.outputs.digest }}`
            Source commit: `${{ steps.source.outputs.sha }}`
