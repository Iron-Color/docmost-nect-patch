name: Sync upstream

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/upstream-sync.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check official repository
        id: upstream
        shell: bash
        run: |
          git remote add upstream https://github.com/docmost/docmost.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or refresh sync pull request
        if: steps.upstream.outputs.updated == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/sync-upstream

          if ! git merge upstream/main --no-edit; then
            echo "::error::Official changes conflict with this fork. Resolve the merge manually."
            exit 1
          fi

          git push --force origin HEAD:automation/sync-upstream

          existing_pr="$(gh pr list \
            --head automation/sync-upstream \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base main \
              --head automation/sync-upstream \
              --title "chore: sync official Docmost updates" \
              --body "Automated merge of the latest docmost/docmost main branch. Review conflicts, run builds and tests, and create a new downstream release before deployment."
          fi

