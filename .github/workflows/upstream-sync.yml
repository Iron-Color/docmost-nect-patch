name: Sync upstream

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upstream-sync.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check official repository
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag="$(gh release view --repo docmost/docmost --json tagName --jq .tagName)"
          if [[ ! "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected official release tag: $latest_tag"
            exit 1
          fi
          git remote add upstream https://github.com/docmost/docmost.git
          git fetch --no-tags upstream "refs/tags/$latest_tag"
          release_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$release_sha" HEAD; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or refresh sync pull request
        if: steps.upstream.outputs.updated == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.upstream.outputs.sha }}
          RELEASE_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/sync-upstream

          if ! git merge "$RELEASE_SHA" --no-edit; then
            echo "::error::Official changes conflict with this fork. Resolve the merge manually."
            exit 1
          fi

          git push --force origin HEAD:automation/sync-upstream

          existing_pr="$(gh pr list \
            --head automation/sync-upstream \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base main \
              --head automation/sync-upstream \
              --title "chore: sync Docmost $RELEASE_TAG" \
              --body "Automated merge of official Docmost release $RELEASE_TAG. Review changes, run builds and tests, and create a new downstream release before deployment."
          fi
